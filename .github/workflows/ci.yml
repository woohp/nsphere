name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build
